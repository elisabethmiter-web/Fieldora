# Render Blueprint for Fielora
# Creates one web service (the app) and one PostgreSQL database.
databases:
  - name: fielora-db
    plan: basic-256mb
    region: ohio
    databaseName: fielora
    user: fielora
    postgresMajorVersion: "16"

services:
  - type: web
    name: fielora
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: fielora-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Outlook email for service reports (optional). Fill these in on the
      # Render dashboard after following "Connect Outlook email" in README.md.
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional: turns on support access from the Fielora Admin dashboard. Paste the key it gives you.
      - key: ADMIN_API_KEY
        sync: false
      # Optional: turns on the AI assistant in the Help chat (an Anthropic API key).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: the support team name shown in the Help chat, e.g. "Helm Support".
      - key: SUPPORT_NAME
        sync: false
      # Optional: loads customer-only code from custom/<name>/ (see custom/README.md). Leave blank for most customers.
      - key: FIELORA_CUSTOM
        sync: false
